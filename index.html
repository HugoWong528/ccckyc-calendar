<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>學校校曆表 - 中華基督教會基元中學</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+HK:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      
      --holiday-public: #ef4444;
      --holiday-school: #f97316;
      --event-school: #3b82f6;
      --event-academic: #10b981;
      --cycle-day: #8b5cf6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans HK', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 24px;
    }

    @media (max-width: 992px) {
      .container { grid-template-columns: 1fr; }
    }

    /* Header */
    .header {
      grid-column: 1 / -1;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 20px 28px;
      border-radius: 16px;
      border: 1px solid var(--border);
      gap: 16px;
    }

    .school-info h1 { font-size: 1.5rem; font-weight: 700; color: #fff; }
    .school-info p { color: var(--text-muted); font-size: 0.9rem; margin-top: 4px; }

    .nav-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn {
      background: #334155;
      border: none;
      color: var(--text);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }
    .btn:hover { background: var(--primary); }
    .current-month-display {
      font-size: 1.25rem;
      font-weight: 700;
      min-width: 170px;
      text-align: center;
    }

    /* Calendar Grid */
    .calendar-card {
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px solid var(--border);
      padding: 24px;
      overflow: hidden;
    }

    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .weekdays div:first-child { color: #f87171; }

    .grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
    }

    .cell {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      min-height: 90px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
    }
    .cell:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .cell.other-month { opacity: 0.25; cursor: default; }
    .cell.selected { border: 2px solid var(--primary); background: rgba(99, 102, 241, 0.1); }
    .cell.sunday .date-num { color: #f87171; }

    .cell-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .date-num { font-weight: 700; font-size: 0.95rem; }
    
    .cycle-badge {
      background: var(--cycle-day);
      color: #fff;
      font-size: 0.65rem;
      padding: 2px 6px;
      border-radius: 6px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .event-dots {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: auto;
    }

    .event-tag {
      font-size: 0.7rem;
      padding: 2px 5px;
      border-radius: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 500;
    }

    .tag-public_holiday { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border-left: 2px solid var(--holiday-public); }
    .tag-school_holiday { background: rgba(249, 115, 22, 0.2); color: #fdba74; border-left: 2px solid var(--holiday-school); }
    .tag-school_event { background: rgba(59, 130, 246, 0.2); color: #93c5fd; border-left: 2px solid var(--event-school); }
    .tag-academic { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; border-left: 2px solid var(--event-academic); }

    /* Side Panel */
    .side-panel {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .panel-card {
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px solid var(--border);
      padding: 20px;
    }

    .panel-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; }
    
    .legend-list { display: flex; flex-direction: column; gap: 10px; font-size: 0.85rem; }
    .legend-item { display: flex; align-items: center; gap: 8px; }
    .legend-indicator { width: 12px; height: 12px; border-radius: 3px; }

    .selected-date-title { color: var(--primary); font-size: 1.2rem; font-weight: 700; margin-bottom: 4px; }
    .selected-cycle { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 16px; }
    .day-events { display: flex; flex-direction: column; gap: 8px; }
    .day-event-card {
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      background: #0f172a;
      border-left: 4px solid var(--primary);
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Header -->
  <header class="header">
    <div class="school-info">
      <h1 id="schoolName">中華基督教會基元中學</h1>
      <p id="academicYear">校曆表 (2026 - 2027)</p>
    </div>
    <div class="nav-controls">
      <button class="btn" onclick="prevMonth()">◀</button>
      <div class="current-month-display" id="monthDisplay">September 2026</div>
      <button class="btn" onclick="nextMonth()">▶</button>
      <button class="btn" onclick="jumpTo(2026, 8)">開學 (9月)</button>
    </div>
  </header>

  <!-- Calendar Grid -->
  <main class="calendar-card">
    <div class="weekdays">
      <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
    </div>
    <div class="grid" id="calendarGrid"></div>
  </main>

  <!-- Side Panel -->
  <aside class="side-panel">
    <!-- Selected Day Detail -->
    <div class="panel-card" id="detailCard">
      <div class="panel-title">日子詳情</div>
      <div class="selected-date-title" id="detailDate">請點擊日期</div>
      <div class="selected-cycle" id="detailCycle">-</div>
      <div class="day-events" id="detailEvents">
        <span style="color: var(--text-muted); font-size: 0.85rem;">暫無特別活動</span>
      </div>
    </div>

    <!-- Legend -->
    <div class="panel-card">
      <div class="panel-title">圖例說明</div>
      <div class="legend-list">
        <div class="legend-item"><div class="legend-indicator" style="background:var(--holiday-public)"></div> 公眾假期 (Public Holiday)</div>
        <div class="legend-item"><div class="legend-indicator" style="background:var(--holiday-school)"></div> 學校假期 (School Holiday)</div>
        <div class="legend-item"><div class="legend-indicator" style="background:var(--event-school)"></div> 學校活動 (School Event)</div>
        <div class="legend-item"><div class="legend-indicator" style="background:var(--event-academic)"></div> 學術/考試 (Academic)</div>
        <div class="legend-item"><div class="legend-indicator" style="background:var(--cycle-day)"></div> 循環日 (Cycle Day I - VI)</div>
      </div>
    </div>
  </aside>
</div>

<script>
  let calendarData = { events: [], cycleDays: {} };
  let currentYear = 2026;
  let currentMonth = 8; // September (0-indexed: 8 = Sep)

  async function loadCalendar() {
    try {
      const res = await fetch('calendar.json');
      calendarData = await res.json();
    } catch (err) {
      console.warn("無法載入 calendar.json，請確保檔案放置於相同資料夾或透過 Local Web Server 運行。");
    }
    renderCalendar();
    selectDate(new Date(2026, 8, 2)); // Default select Day 1 of term
  }

  function renderCalendar() {
    const grid = document.getElementById('calendarGrid');
    grid.innerHTML = '';

    const firstDayIndex = new Date(currentYear, currentMonth, 1).getDay();
    const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();
    const prevMonthDays = new Date(currentYear, currentMonth, 0).getDate();

    const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
    document.getElementById('monthDisplay').textContent = `${monthNames[currentMonth]} ${currentYear}`;

    // Prev month padding
    for (let i = firstDayIndex - 1; i >= 0; i--) {
      const cell = document.createElement('div');
      cell.className = 'cell other-month';
      cell.innerHTML = `<span class="date-num">${prevMonthDays - i}</span>`;
      grid.appendChild(cell);
    }

    // Current month days
    for (let day = 1; day <= totalDays; day++) {
      const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      const cellDate = new Date(currentYear, currentMonth, day);
      const isSunday = cellDate.getDay() === 0;

      const cell = document.createElement('div');
      cell.className = `cell ${isSunday ? 'sunday' : ''}`;
      cell.onclick = () => selectDate(cellDate, dateStr);

      const cycle = calendarData.cycleDays ? calendarData.cycleDays[dateStr] : null;
      const dayEvents = getEventsForDate(dateStr);

      let topHtml = `<div class="cell-top"><span class="date-num">${day}</span>`;
      if (cycle) {
        topHtml += `<span class="cycle-badge">Day ${cycle}</span>`;
      }
      topHtml += `</div>`;

      let eventsHtml = `<div class="event-dots">`;
      dayEvents.forEach(ev => {
        eventsHtml += `<div class="event-tag tag-${ev.type}" title="${ev.title}">${ev.title}</div>`;
      });
      eventsHtml += `</div>`;

      cell.innerHTML = topHtml + eventsHtml;
      cell.id = `day-${dateStr}`;
      grid.appendChild(cell);
    }
  }

  function getEventsForDate(dateStr) {
    if (!calendarData.events) return [];
    return calendarData.events.filter(ev => dateStr >= ev.startDate && dateStr <= ev.endDate);
  }

  function selectDate(dateObj, dateStr) {
    if (!dateStr) {
      dateStr = `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, '0')}-${String(dateObj.getDate()).padStart(2, '0')}`;
    }

    document.querySelectorAll('.cell.selected').forEach(el => el.classList.remove('selected'));
    const activeCell = document.getElementById(`day-${dateStr}`);
    if (activeCell) activeCell.classList.add('selected');

    const cycle = calendarData.cycleDays ? calendarData.cycleDays[dateStr] : null;
    const events = getEventsForDate(dateStr);

    document.getElementById('detailDate').textContent = dateStr;
    document.getElementById('detailCycle').textContent = cycle ? `循環週次：Day ${cycle}` : '非教學日 / 循環日未設定';

    const eventsContainer = document.getElementById('detailEvents');
    if (events.length === 0) {
      eventsContainer.innerHTML = `<span style="color: var(--text-muted); font-size: 0.85rem;">當日冇特別活動 / 假期</span>`;
    } else {
      eventsContainer.innerHTML = events.map(ev => `
        <div class="day-event-card" style="border-left-color: var(--${ev.type.replace('_', '-')})">
          <strong>${ev.title}</strong>
          <div style="color: var(--text-muted); font-size: 0.75rem; margin-top: 2px;">類型：${ev.type}</div>
        </div>
      `).join('');
    }
  }

  function prevMonth() {
    currentMonth--;
    if (currentMonth < 0) { currentMonth = 11; currentYear--; }
    renderCalendar();
  }

  function nextMonth() {
    currentMonth++;
    if (currentMonth > 11) { currentMonth = 0; currentYear++; }
    renderCalendar();
  }

  function jumpTo(year, month) {
    currentYear = year;
    currentMonth = month;
    renderCalendar();
  }

  window.onload = loadCalendar;
</script>
</body>
</html>
